.g-content{position:absolute;inset:0}

#iris,#cursor{position:absolute;left:0;top:0;pointer-events:none}
#cursor{transform-origin:0 0;width:30px;height:34px}
svg{overflow:visible}

<script>

// Closed-form step response of a damped spring (0 → 1). w: natural freq (rad/s), z: damping ratio.

const ICON = {

  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',

  arrow: '<path d="M7 17 17 7M8 7h9v9"/>',

  next: '<path d="M13 7l6 5-6 5zM5 7l6 5-6 5z" fill="currentColor"/>',
  check: '<path d="M5 12.5 10 17.5 19.5 7" pathLength="1"/>',
  printer: '<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 14h10v6H7z"/>',

  star: '<path d="m12 4 2.3 5 5.2.5-3.9 3.5 1.1 5.2L12 15.6 7.3 18.2l1.1-5.2L4.5 9.5 9.7 9z"/>',

const icon = (name, size, color, sw = 2) =>

/* ---------------------------------------------------------------- iris --- */
// 6 blades around a hexagonal aperture. Each blade = its two hexagon vertices,
// both edge extensions out to the housing circle, and the SHORT arc between them.
function makeIris(svg, fills = ['#121212', '#0E0E0E'], stroke = '#2A2A2A') {
  return Array.from({ length: 6 }, (_, k) => svgEl('path', { fill: fills[k % 2], stroke, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, svg));
}
function drawIris(paths, Ap, cx, cy, Rh, rot0 = 0) {      // Ap: 1 open … 0 shut; Rh: housing radius
  const rMax = Rh / Math.cos(Math.PI / 6) + 8;
  const r = clamp(Ap) * rMax;
  const th = rot0 + (1 - clamp(Ap)) * (40 * Math.PI / 180);
  const f = v => v.toFixed(2);
  for (let k = 0; k < 6; k++) {
    const p = paths[k];
    const a0 = th + k * Math.PI / 3, a1 = a0 + Math.PI / 3;
    const V0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)], V1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
    const ea = a0 + 2 * Math.PI / 3;                   // edge direction V0 → V1, valid even at r = 0
    const d = [Math.cos(ea), Math.sin(ea)];
    const ox = V0[0] - cx, oy = V0[1] - cy;
    const b = d[0] * ox + d[1] * oy, c = ox * ox + oy * oy - Rh * Rh;
    const disc = b * b - c;
    if (Ap >= 1 || disc <= 0) { p.setAttribute('d', ''); continue; }
    const sPlus = -b + Math.sqrt(disc), sMinus = -b - Math.sqrt(disc);
    const P = [V0[0] + d[0] * sPlus, V0[1] + d[1] * sPlus], Q = [V0[0] + d[0] * sMinus, V0[1] + d[1] * sMinus];
    // short arc P → Q on the outer side of the edge
    const aP = Math.atan2(P[1] - cy, P[0] - cx), aQ = Math.atan2(Q[1] - cy, Q[0] - cx);
    let dA = aQ - aP; while (dA <= -Math.PI) dA += 2 * Math.PI; while (dA > Math.PI) dA -= 2 * Math.PI;
    const nA = a0 + Math.PI / 6;                       // outward normal of this edge
    const mid = aP + dA / 2;
    const diff = Math.abs(Math.atan2(Math.sin(mid - nA), Math.cos(mid - nA)));
    if (diff > Math.PI / 2) dA = dA > 0 ? dA - 2 * Math.PI : dA + 2 * Math.PI;
    const sweep = dA > 0 ? 1 : 0, large = Math.abs(dA) > Math.PI ? 1 : 0;
    p.setAttribute('d', `M${f(Q[0])},${f(Q[1])} L${f(V0[0])},${f(V0[1])} L${f(V1[0])},${f(V1[1])} L${f(P[0])},${f(P[1])} A${Rh},${Rh} 0 ${large} ${sweep} ${f(Q[0])},${f(Q[1])} Z`);
  }
}

function measureWordmark() {
  const probe = h('div', 'a wm', document.body);
  S(probe, { visibility: 'hidden', fontSize: '100px', lineHeight: '100px' });
  const chars = [...WORD];
  const spans = chars.map(c => { const s = h('span', '', probe); s.textContent = c; return s; });
  const r0 = probe.getBoundingClientRect();
  const pos = spans.map(s => { const r = s.getBoundingClientRect(); return { x: r.left - r0.left, w: r.width }; });
  const textW = r0.width;
  const samples = [62, 69, 76, 83, 90, 97, 104, 111, 118, 125];
  const nat = chars.map(() => []);
  for (const wd of samples) { probe.style.fontVariationSettings = `"wdth" ${wd}`; spans.forEach((s, i) => nat[i].push(s.getBoundingClientRect().width)); }
  probe.style.fontVariationSettings = '"wdth" 125';
  const mk = h('span', '', probe); S(mk, { display: 'inline-block', width: '1px', height: '0px', verticalAlign: 'baseline' });
  const baseline = mk.getBoundingClientRect().top - probe.getBoundingClientRect().top;
  probe.remove();
  // layout: total width (letters + gap + dot) = 1140, x-height centred on 720
  const GAP = 3.6, DOT = 19;
  const F = 1140 / (textW + GAP + DOT);
  const fs = 100 * F, startX = C - 570, baseY = C + fs * .262 - 24;
  const top = baseY - baseline * F;
  const dd = DOT * F, dotL = startX + (textW + GAP) * F;
  return {
    chars, samples, F, fs, top, baseY, dd,
    nat: nat.map(a => a.map(v => v * F)),
    xs: pos.map(p => startX + p.x * F), ws: pos.map(p => p.w * F),
    dotL, dotCx: dotL + dd / 2, dotCy: baseY - dd / 2,
  };
}
function natWidth(i, wd) {

}

const CUR = { x: T(0), y: T(0), p: T(0) };
const camAt = t => ({ s: CAM.s.at(t), x: CAM.x.at(t), y: CAM.y.at(t) });
function camTo(t, s, x, y, r, k = Math.min(s, 1.6)) { CAM.s.to(t, s, r); CAM.x.to(t, x, r); CAM.y.to(t, y, r); CAM.k.to(t, k, r); }
function rebase(t, s, x, y) {
  // re-anchor the camera under a full-black frame (the cursor is re-anchored in buildTimeline)
  const st = R.step();
  CAM.s.to(t, s, st); CAM.x.to(t, x, st); CAM.y.to(t, y, st);
}
const press = t => CUR.p.to(t, 1, R.ez(.05));
const release = t => CUR.p.to(t, 0, R.sp(.25, .45));
const click = t => { press(t - .04); release(t + .06); };
const curWorld = t => ({ x: CUR.x.at(t), y: CUR.y.at(t) });

/* ============================================================ timeline === */
function buildTimeline() {
  const wm = M.wm;
  const tl = {};
  // ---- OPEN
  tl.squeeze = T(1).to(B(2) + .05, 0, R.ez(.48, E.snap)).to(25.78, 1, R.sp(.5, .32));
  tl.blob = RT(wm.dotCx, wm.dotCy, wm.dd, wm.dd, 130);
  rto(tl.blob, B(3), [wm.dotCx, wm.dotCy, wm.dd * 1.32, wm.dd * 1.32, 130], R.sp(.2, .5));
  rto(tl.blob, B(3) + .1, [wm.dotCx, wm.dotCy, wm.dd, wm.dd, 130], R.sp(.28, .3));
  rto(tl.blob, B(4), [C, C, PILL_W, 120, 130], R.sp(.5, .22));
  rto(tl.blob, B(7), [C, C, 260, 260, 130], R.sp(.42, .25));                // pill → circle; blades close
  rto(tl.blob, B(8) + .02, [C, C, 1000, 1000, 64], R.sp(.55, .14));          // opens onto the door, grows
  rto(tl.blob, B(9), [C, C, 300, 300, 22], R.sp(.5, .16));                   // becomes the grid's centre tile
  rto(tl.blob, B(13), [GB[4].x, GB[4].y, GB[4].s, GB[4].s, GB[4].r], R.sp(.5, .18));
  rto(tl.blob, 25.0, [C, C, PILL_W, 120, 60], R.step());                      // hidden reset; frame is black
  rto(tl.blob, 25.6, [wm.dotCx, wm.dotCy, wm.dd, wm.dd, 0], R.sp(.24, .12));
  tl.blobIris = T(1).to(B(7) + .04, 0, R.ez(.3, E.shutter)).to(B(8), 1, R.ez(.34, E.out));
  // grid tiles: pop out from behind the centre, then reflow when the arch claims 2×2
  tl.tiles = {}; tl.tileLift = {};
  for (const i of [0, 1, 2, 3, 6, 7, 8]) {
    const a = GA(i), b = GB[i];
    const rt = RT(C, C, 300, 300, 22);
    rto(rt, POP_T[i], [a.x, a.y, a.s, a.s, a.r], R.sp(.5, .2));
    rto(rt, B(13) + (i % 3) * .03, [b.x, b.y, b.s, b.s, b.r], R.sp(.5, .18));
    tl.tiles[i] = rt; tl.tileLift[i] = T(1);
  }
  tl.tileLift[1].to(B(11), 1.05, R.sp(.3, .3)).to(B(12) - .1, 1, R.sp(.3, .2));
  // arch tile → full frame, landing exactly on the drop (beat 17)
  tl.arch = RT(C, C, 300, 300, 22);
  rto(tl.arch, POP_T[5], [GA(5).x, GA(5).y, 300, 300, 22], R.sp(.5, .2));
  rto(tl.arch, B(13), [GB[5].x, GB[5].y, GB[5].s, GB[5].s, 22], R.sp(.55, .16));
  rto(tl.arch, B(15), [C, C, W, W, 0], R.ez(1.0, E.drop));
  tl.archLift = T(1).to(B(12), 1.04, R.sp(.3, .3)).to(B(13) - .05, 1, R.sp(.3, .2)).to(B(15) - .04, .97, R.ez(.05)).to(B(15) + .06, 1, R.sp(.3, .2));
  // toolbar → slider, relight, lens → orb
  tl.tbScale = T(0).to(B(18), 1, R.sp(.45, .32)).to(B(22) + .04, 0, R.sp(.3, 0));
  tl.tbW = T(520).to(B(19), 820, R.sp(.42, .2));
  tl.tbH = T(96).to(B(19), 150, R.sp(.42, .2));
  tl.trackW = T(0).to(B(19) + .06, TRACK.len, R.sp(.45, .18));
  tl.drag = T(0).to(B(20) + .1, .45, R.ez(.36, E.snap)).to(B(21), 1, R.ez(.4, E.snap));
  tl.orbS = T(40).to(B(20), 110, R.sp(.34, .35)).to(B(22), 300, R.sp(.5, .25)).to(B(24), 2300, R.ez(.32, E.in));
  tl.orbX = T(TRACK.x0 + TRACK.len).to(B(22), C, R.sp(.55, .15));
  tl.orbY = T(TRACK.y).to(B(22), 560, R.sp(.55, .15)).to(B(24), C, R.ez(.32, E.in));
  tl.orbReveal = T(0).to(B(23), 140, R.ez(.36, E.out)).to(B(24), 2000, R.ez(.32, E.in));
  // lock screen → phone
  tl.lock = RT(C, C, W, W, 0);
  rto(tl.lock, B(28), [PHONE.x, PHONE.y, PHONE.w, PHONE.h, PHONE.r], R.sp(.62, .12));
  tl.playPress = T(0).to(B(27) - .04, 1, R.ez(.05)).to(B(27) + .06, 0, R.sp(.25, .45));
  // browser window from the droplet
  tl.br = RT(BRC.x, BRC.y, 30, 30, 15);
  rto(tl.br, B(30) + .42, [BRC.x, BRC.y, BR.w, BR.h, 20], R.sp(.5, .15));
  // card: phone → drop zone → site tile
  const dz = toW(DROP.x, DROP.y), tileW = toW(TILE.x + TILE.w / 2, TILE.y + TILE.h / 2);
  tl.card = RT(dz.x, dz.y, 120, 160, 12);
  rto(tl.card, B(33), [dz.x, dz.y, 150, 150, 14], R.sp(.35, .3));
  rto(tl.card, B(34), [tileW.x, tileW.y, TILE.w, TILE.h, 14], R.sp(.5, .16));
  // order button → black shape → flood
  const bw = toW(BTN.x + BTN.w / 2, BTN.y + BTN.h / 2);
  tl.btn = RT(bw.x, bw.y, BTN.w, BTN.h, BTN.h / 2);
  rto(tl.btn, B(40), [bw.x, bw.y, BTN.h, BTN.h, BTN.h / 2], R.sp(.36, .2));
  rto(tl.btn, B(41), [bw.x, bw.y, BTN.w, BTN.h, BTN.h / 2], R.sp(.42, .2));
  rto(tl.btn, B(44), [bw.x, bw.y, 64, 64, 32], R.sp(.4, .3));
  rto(tl.btn, B(45), [bw.x, bw.y, 1700, 1700, 850], R.ez(.3, E.in));          // flood past the corners
  tl.btnPress = T(0).to(B(40) - .04, 1, R.ez(.05)).to(B(40) + .06, 0, R.sp(.25, .45));
  // wall: black contracts into the frame, iris opens on the print
  const [fx, fy, fw, fh] = WALL.frame;
  tl.wallBlack = { x: T(-200), y: T(-200), w: T(W + 400), h: T(W + 400), r: T(0) };
  [['x', fx], ['y', fy], ['w', fw], ['h', fh], ['r', 3]].forEach(([k, v]) => tl.wallBlack[k].to(B(46) + .25, v, R.ez(.3, E.snap)));
  tl.wallIris = T(0).to(B(47) + .05, 1, R.ez(.34, E.out));
  tl.iris = T(1).to(B(51), 0, R.ez(.2, E.shutter)).to(25.21, 1, R.step());
  tl.flood = RT(C, C, W + 40, W + 40, 0);
  rto(tl.flood, 25.3, [C, C, PILL_W, 120, 60], R.ez(.3, E.snap));
  TL = tl;

  // ---- CAMERA (screen-studio zooms; cursor scales with it)
  const dot = { x: wm.dotCx, y: wm.dotCy };
  camTo(B(2), 1.15, lerp(C, dot.x, .5), dot.y, R.ez(.5, E.io));
  camTo(B(3), 1.4, dot.x - 40, dot.y, R.sp(.5, .1));
  camTo(B(4), 1.2, C, C, R.sp(.6, .1));
  camTo(B(7), 1.45, C, C, R.ez(.4, E.io));
  camTo(B(8) + .05, 1.0, C, C, R.sp(.6, .08));
  camTo(B(16), 1.0, C, C, R.sp(.6, .1));
  camTo(B(28), 1.0, C, C, R.sp(.6, .1));
  camTo(B(34), 1.95, BRC.x, BRC.y, R.sp(.75, .06));
  camTo(B(38) + .2, 2.15, BR.x + 470, BR.y + 330, R.sp(.7, .06));
  camTo(B(41), 2.3, toW(BTN.x + BTN.w / 2, 0).x, toW(0, BTN.y - 30).y, R.sp(.6, .06));
  rebase(B(46), 1, C, C);
  CAM.k.to(B(46), 1, R.sp(.5, .1));
  const pic = { x: WALL.pic[0] + WALL.pic[2] / 2, y: WALL.pic[1] + WALL.pic[3] / 2 };
  camTo(B(48), 1.12, C, 700, R.sp(.8, .05), 1);
  camTo(B(49), 2.5, pic.x, pic.y, R.ez(.95, E.snap), 1.2);
  rebase(25.21, 1, C, C);
  CAM.k.to(25.21, 1, R.sp(.5, .1));

  // ---- CURSOR (world coordinates; re-anchored at each rebase so it never jumps on screen)
  const rest = { x: dot.x + 66, y: dot.y + 74 };
  CUR.x.v0 = rest.x; CUR.y.v0 = rest.y;
  const C0 = [];
  const mv = (t, x, y, d = .35, e = E.io) => C0.push(['m', t, x, y, d, e]);
  const pr = t => C0.push(['p', t]), rl = t => C0.push(['r', t]), ck = t => C0.push(['c', t]);
  mv(.12, dot.x + 4, dot.y + 4, .36);
  pr(B(2) - .02); rl(B(3));                                         // long-press → accordion
  mv(B(4) + .2, C + PILL_W / 2 - 40, C + 70, .5);
  mv(B(6) + .36, C + 60, C + 12, .2);
  ck(B(7));                                                         // Enter → iris
  mv(B(9) + .1, C + 120, C + 160, .4);
  mv(B(11) - .2, GA(1).x + 40, GA(1).y + 30, .3);                  // hover a tile
  mv(B(12) - .2, GA(5).x + 20, GA(5).y + 20, .3);                  // hover the arch
  mv(B(13) + .1, GB[5].x + 30, GB[5].y + 40, .4);                  // ride the reflow
  ck(B(15));                                                        // click → zoom to the drop
  mv(B(16), C + 60, C + 120, .6);
  mv(B(18) + .1, TB.x + 180, TB.y + 2, .32);                       // to the adjust icon
  ck(B(19));
  mv(B(19) + .2, TRACK.x0 + 2, TRACK.y + 3, .26);                  // to the knob
  pr(B(20));                                                        // knob → lens
  C0.push(['drag']);
  rl(B(22) + .05);
  mv(B(22), C + 8, 566, .55, E.io);                                // ride the orb up
  mv(B(24) + .3, C + 300, 1150, .4);
  mv(B(26) + .2, 1024, 1222, .3);                                  // to play
  ck(B(27));
  mv(B(28), 640, 1000, .5);
  pr(B(29) - .02); mv(B(29), islandWorld().x + 170, islandWorld().y + 4, .5, E.io); rl(B(30));
  mv(B(30) + .5, 470, 820, .35);
  mv(B(32) - .25, PHONE.x, PHONE.y + 40, .22);                      // to the wallpaper
  pr(B(32)); C0.push(['ring']);
  mv(B(32) + .2, toW(DROP.x, DROP.y).x, toW(DROP.x, DROP.y).y, .3, E.io);   // drag into the browser
  rl(B(33));
  mv(B(34) + .1, toW(TILE.x + 100, TILE.y + 150).x, toW(TILE.x + 100, TILE.y + 150).y, .3);
  ck(B(35));                                                        // tile → product page
  mv(B(36) + .2, toW(380, 210).x, toW(380, 210).y, .28);
  ck(B(37));                                                        // black frame
  mv(B(37) + .2, toW(BTN.x + 250, 278).x, toW(BTN.x + 250, 278).y, .26);
  ck(B(38));                                                        // 70×100
  mv(B(39), toW(BTN.x + 190, BTN.y + 24).x, toW(BTN.x + 190, BTN.y + 24).y, .3);
  ck(B(40));                                                        // Order print
  mv(B(41) + .3, toW(BTN.x + 230, BTN.y + 70).x, toW(BTN.x + 230, BTN.y + 70).y, .5);
  C0.push(['rb', B(46)]);
  mv(B(47) + .3, 1120, 1180, .5);
  C0.push(['rb', 25.21]);
  mv(25.3, rest.x, rest.y, 1.0, E.io);

  for (const step of C0) {
    const [kind, t] = step;
    if (kind === 'm') { CUR.x.to(t, step[2], R.ez(step[4], step[5])); CUR.y.to(t, step[3], R.ez(step[4], step[5])); }
    else if (kind === 'p') press(t);
    else if (kind === 'r') release(t);
    else if (kind === 'c') click(t);
    else if (kind === 'rb') {
      const before = camAt(t - 1e-6), after = camAt(t);
      const cx = CUR.x.at(t - 1e-6), cy = CUR.y.at(t - 1e-6);
      const sx = C + (cx - before.x) * before.s, sy = C + (cy - before.y) * before.s;
      const nx = (sx - C) / after.s + after.x, ny = (sy - C) / after.s + after.y;
      CUR.x.to(t, CUR.x.last() + (nx - cx), R.step()); CUR.y.to(t, CUR.y.last() + (ny - cy), R.step());
    } else if (kind === 'drag') {
      // the cursor holds the knob: same keys, same curves
      CUR.x.to(B(20) + .1, TRACK.x0 + TRACK.len * .45, R.ez(.36, E.snap));
      CUR.x.to(B(21), TRACK.x0 + TRACK.len, R.ez(.4, E.snap));
    }
  }
}

function updateCamera(t) {
  const c = camAt(t);
  tf(world, `translate(${C - c.x * c.s}px,${C - c.y * c.s}px) scale(${c.s})`);
  const cw = curWorld(t);
  const sx = C + (cw.x - c.x) * c.s, sy = C + (cw.y - c.y) * c.s;
  const k = CAM.k.at(t) * (1 - .16 * CUR.p.at(t));
  tf($('#cursor'), `translate(${(sx - 3 * k).toFixed(2)}px,${(sy - 2 * k).toFixed(2)}px) scale(${k.toFixed(4)})`);
  // long-press ring (phone wallpaper → card)
  const ringP = R.ez(.4, E.lin)(t - B(32) + .4);
  show($('#ring'), on(t, B(32) - .4, B(32)));
  $('#ringArc').setAttribute('stroke-dasharray', `${ringP.toFixed(4)} 1`);
  drawIris(M.iris, TL.iris.at(t), C, C, 1060);
}

/* =============================================================== seek ==== */
async function seek(tIn) {
  const t = ((tIn % DUR) + DUR) % DUR;
  updateOpen(t);
  updateArch(t);
  updateLock(t);
  updateBrowser(t);
  updateWall(t);
  updateFlood(t);
  updateCamera(t);
  for (const G of glasses) if (G.on) await paintGlass(G); else G.src.replaceChildren();
  await raf();
  return t;
}

/* =============================================================== init ==== */
async function init() {
  await document.fonts.load('800 100px Archivo', WORD + '.'); await document.fonts.load('800 40px Archivo', 'abdullah üçdağ. the print');
  await document.fonts.load('700 340px Geist', '9:41'); await document.fonts.load('500 20px Geist'); await document.fonts.load('400 20px "Geist Mono"');
  await document.fonts.ready;
  M.wm = measureWordmark();
  // DOM order = paint order
  buildOpen(); buildArch(); buildLock(); buildBrowser(); buildWall(); buildFlood();
  // everything built after the arch paints above it (the arch itself climbs to z 3 when it zooms)
  [...world.children].slice([...world.children].indexOf(L.arch) + 1).forEach(e => { e.style.zIndex = 4; });
  M.iris = makeIris($('#iris'));
  await Promise.all([...document.images].map(i => i.decode().catch(() => console.warn('missing image', i.src))));
  buildTimeline();
  await seek(0);
  window.FILM = { DUR, BPM, BEATS, beat: B, ready: true };
}
window.seek = seek;
window.filmReady = init();
// preview in a normal browser: ?play  (still pure: every frame is seek(now))
if (location.search.includes('play')) window.filmReady.then(() => {
  const t0 = performance.now();
  const loop = async () => { await seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
});
</script>
